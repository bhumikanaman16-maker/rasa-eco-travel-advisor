version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hello
      - hi there
      - good morning
      - hey eco advisor
      - greetings assistant

  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - see you later
      - that's all thanks
      - have a nice day

  - intent: affirm
    examples: |
      - yes
      - yes please
      - absolutely
      - that works
      - sounds good

  - intent: deny
    examples: |
      - no
      - nope
      - not really
      - no thanks
      - I would rather not

  - intent: plan_trip
    examples: |
      - I want to plan a trip
      - help me plan a sustainable holiday
      - I want an eco friendly trip
      - plan a low carbon holiday for me
      - design my vacation

  - intent: provide_destination
    examples: |
      - I want to visit [Paris](destination)
      - my destination is [Berlin](destination)
      - [Amsterdam](destination)
      - take me to [Rome](destination)
      - [Barcelona](destination)

  - intent: provide_duration
    examples: |
      - [3 days](trip_duration)
      - [5 days](trip_duration)
      - [1 week](trip_duration)
      - [10 days](trip_duration)
      - [weekend getaway](trip_duration)

  - intent: provide_dates
    examples: |
      - [10 October to 15 October](travel_dates)
      - [5 November to 9 November](travel_dates)
      - [next weekend](travel_dates)
      - during [Summer](travel_dates)
      - [next month](travel_dates)

  - intent: provide_party
    examples: |
      - [Solo explorer](travel_party)
      - [Couple](travel_party)
      - [Family with kids](travel_party)
      - [Group of friends](travel_party)
      - traveling alone

  - intent: provide_style
    examples: |
      - [Nature & Wildlife](trip_style)
      - [Culture & History](trip_style)
      - [Foodie & Culinary](trip_style)
      - [Outdoor Adventure](trip_style)
      - [Eco-Wellness & Relaxation](trip_style)

  - intent: provide_pace
    examples: |
      - [Relaxed](travel_pace)
      - [Balanced](travel_pace)
      - [Action-packed](travel_pace)
      - slow and leisurely pace

  - intent: provide_budget
    examples: |
      - [800 euros](budget)
      - [1000 euros](budget)
      - [£1200](budget)
      - [Budget / Backpacker](budget)
      - [Luxury Eco-Lodge](budget)

  - intent: provide_sustainability
    examples: |
      - [high](sustainability_level)
      - [medium](sustainability_level)
      - [low](sustainability_level)
      - maximum eco friendly
      - balanced sustainability

  - intent: provide_origin
    examples: |
      - I am travelling from [London](origin)
      - my journey starts in [Berlin](origin)
      - starting from [Paris](origin)
      - [Delhi](origin)
      - [Jaipur](origin)

  - intent: provide_transport_mode
    examples: |
      - [rail](transport_mode)
      - [train](transport_mode)
      - [car](transport_mode)
      - [air](transport_mode)
      - [plane](transport_mode)

  - intent: ask_itinerary
    examples: |
      - create a day by day itinerary
      - give me a 3-day itinerary for [Paris](destination)
      - show me the daily schedule
      - what is the itinerary for my trip
      - design a 5 day travel schedule

  - intent: ask_dining
    examples: |
      - recommend green dining options
      - where can I find vegan and organic restaurants
      - show farm to table restaurants in [Paris](destination)
      - sustainable food options in [Berlin](destination)
      - zero waste dining spots

  - intent: ask_packing_tips
    examples: |
      - what should I pack for my trip
      - give me an eco friendly packing checklist
      - zero waste packing tips
      - what essentials should I bring
      - sustainable packing list

  - intent: ask_eco_tips
    examples: |
      - give me sustainable travel tips
      - how can I reduce my environmental impact while travelling
      - tips for zero waste travel
      - best practices for eco tourism
      - leave no trace travel advice

  - intent: ask_budget_breakdown
    examples: |
      - how should I divide my budget
      - budget breakdown for sustainable travel
      - how to allocate [1000 euros](budget)
      - sustainable budget advice

  - intent: ask_weather
    examples: |
      - what is the best time of year to visit
      - when is the eco season to travel
      - weather forecast and best seasons
      - climate advice for [Amsterdam](destination)

  - intent: ask_transport
    examples: |
      - recommend sustainable transport
      - which transport has lower emissions
      - compare transport options
      - what is the greenest transport option

  - intent: ask_accommodation
    examples: |
      - recommend an eco friendly hotel
      - find a green hotel
      - where should I stay
      - show me sustainable accommodation

  - intent: ask_activities
    examples: |
      - recommend sustainable activities
      - what eco friendly activities can I do
      - suggest local eco tours
      - show me local cultural experiences

  - intent: ask_flights
    examples: |
      - search for flights
      - find me eco friendly flight options
      - check available flights
      - show flights for my trip

  - intent: ask_carbon
    examples: |
      - calculate my carbon footprint
      - how much carbon will this trip produce
      - what are the emissions for this journey
      - estimate my travel emissions

  - intent: ask_carbon_offset
    examples: |
      - recommend carbon offset programmes
      - how can I offset my remaining travel emissions
      - show me verified carbon offset options
      - tell me about carbon credit options

  - intent: ask_handover
    examples: |
      - I want to speak to a human
      - connect me to a travel advisor
      - I need a human advisor
      - please escalate my request

  - intent: thank_you
    examples: |
      - thank you
      - thanks a lot
      - that was very helpful
      - brilliant thank you

  - intent: bot_challenge
    examples: |
      - are you a bot
      - are you human
      - am I talking to an AI
      - what are you

  - intent: out_of_scope
    examples: |
      - tell me a joke
      - who won the football match
      - order food for me
      - what is the meaning of life
