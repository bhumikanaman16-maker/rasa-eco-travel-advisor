version: "3.1"

# Comprehensive test stories for Rasa model evaluation
# Evaluates multi-turn conversation flows, forms, and custom actions.

stories:

  # ── TEST 1: Greeting ─────────────────────────────────────────────
  - story: test greeting
    steps:
      - user: |
          hello
        intent: greet
      - action: utter_greet

  # ── TEST 2: Goodbye ──────────────────────────────────────────────
  - story: test goodbye
    steps:
      - user: |
          bye
        intent: goodbye
      - action: utter_goodbye

  # ── TEST 3: Thank you ────────────────────────────────────────────
  - story: test thank you
    steps:
      - user: |
          thank you
        intent: thank_you
      - action: utter_thank_you

  # ── TEST 4: Bot challenge ────────────────────────────────────────
  - story: test bot challenge
    steps:
      - user: |
          are you a bot
        intent: bot_challenge
      - action: utter_iamabot

  # ── TEST 5: Out of scope ─────────────────────────────────────────
  - story: test out of scope
    steps:
      - user: |
          tell me a joke
        intent: out_of_scope
      - action: utter_out_of_scope

  # ── TEST 6: Full trip planning form ──────────────────────────────
  - story: test full trip planning consultation
    steps:
      - user: |
          I want to plan a trip
        intent: plan_trip
      - action: trip_planning_form
      - active_loop: trip_planning_form
      - user: |
          I want to visit [Paris](destination)
        intent: provide_destination
      - action: trip_planning_form
      - user: |
          stay for [5 days](trip_duration)
        intent: provide_duration
      - action: trip_planning_form
      - user: |
          I want to travel from [10 October to 15 October](travel_dates)
        intent: provide_dates
      - action: trip_planning_form
      - user: |
          [Couple](travel_party)
        intent: provide_party
      - action: trip_planning_form
      - user: |
          I like [Nature & Wildlife](trip_style)
        intent: provide_style
      - action: trip_planning_form
      - user: |
          [Balanced](travel_pace)
        intent: provide_pace
      - action: trip_planning_form
      - user: |
          my budget is [1000 euros](budget)
        intent: provide_budget
      - action: trip_planning_form
      - user: |
          [high](sustainability_level)
        intent: provide_sustainability
      - action: trip_planning_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_submit_trip_plan

  # ── TEST 7: Request bespoke itinerary ────────────────────────────
  - story: test ask itinerary
    steps:
      - user: |
          create a day by day itinerary
        intent: ask_itinerary
      - action: action_generate_itinerary

  # ── TEST 8: Request green dining ─────────────────────────────────
  - story: test ask dining
    steps:
      - user: |
          recommend green dining options
        intent: ask_dining
      - action: action_recommend_dining

  # ── TEST 9: Request packing tips ─────────────────────────────────
  - story: test ask packing tips
    steps:
      - user: |
          what should I pack for my trip
        intent: ask_packing_tips
      - action: action_recommend_packing

  # ── TEST 10: Request eco tips ────────────────────────────────────
  - story: test ask eco tips
    steps:
      - user: |
          give me sustainable travel tips
        intent: ask_eco_tips
      - action: action_provide_eco_tips

  # ── TEST 11: Request budget breakdown ────────────────────────────
  - story: test ask budget breakdown
    steps:
      - user: |
          how should I divide my budget
        intent: ask_budget_breakdown
      - action: action_budget_breakdown

  # ── TEST 12: Request weather advice ──────────────────────────────
  - story: test ask weather
    steps:
      - user: |
          what is the best time of year to visit
        intent: ask_weather
      - action: action_weather_advice

  # ── TEST 13: Request sustainable transport ───────────────────────
  - story: test ask transport
    steps:
      - user: |
          recommend sustainable transport
        intent: ask_transport
      - action: action_recommend_transport

  # ── TEST 14: Request eco accommodation ───────────────────────────
  - story: test ask accommodation
    steps:
      - user: |
          recommend an eco friendly hotel
        intent: ask_accommodation
      - action: action_recommend_accommodation

  # ── TEST 15: Request sustainable activities ──────────────────────
  - story: test ask activities
    steps:
      - user: |
          recommend sustainable activities
        intent: ask_activities
      - action: action_recommend_activities

  # ── TEST 16: Request flight search ───────────────────────────────
  - story: test ask flights
    steps:
      - user: |
          search for flights
        intent: ask_flights
      - action: action_search_flights

  # ── TEST 17: Carbon calculation form ─────────────────────────────
  - story: test carbon calculation form
    steps:
      - user: |
          calculate my carbon footprint
        intent: ask_carbon
      - action: carbon_calculation_form
      - active_loop: carbon_calculation_form
      - user: |
          I am travelling from [London](origin)
        intent: provide_origin
      - action: carbon_calculation_form
      - user: |
          I want to visit [Paris](destination)
        intent: provide_destination
      - action: carbon_calculation_form
      - user: |
          I want to travel by [train](transport_mode)
        intent: provide_transport_mode
      - action: carbon_calculation_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_calculate_carbon

  # ── TEST 18: Request carbon offsets ──────────────────────────────
  - story: test ask carbon offsets
    steps:
      - user: |
          recommend carbon offset programmes
        intent: ask_carbon_offset
      - action: action_recommend_carbon_offsets

  # ── TEST 19: Request human handover ──────────────────────────────
  - story: test human handover
    steps:
      - user: |
          I want to speak to a human
        intent: ask_handover
      - action: action_human_handover
