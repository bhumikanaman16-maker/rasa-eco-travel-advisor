version: "3.1"

stories:
  - story: greet and start sustainable trip planning
    steps:
      - intent: greet
      - action: utter_greet
      - intent: affirm
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - story: directly start trip planning
    steps:
      - intent: plan_trip
      - action: trip_planning_form
      - active_loop: trip_planning_form

  - story: trip planning completed
    steps:
      - action: trip_planning_form
      - active_loop: null
      - action: action_submit_trip_plan

  - story: plan trip then request custom itinerary
    steps:
      - intent: plan_trip
      - action: trip_planning_form
      - active_loop: trip_planning_form
      - active_loop: null
      - action: action_submit_trip_plan
      - intent: ask_itinerary
      - action: action_generate_itinerary

  - story: plan trip then request green dining
    steps:
      - intent: plan_trip
      - action: trip_planning_form
      - active_loop: trip_planning_form
      - active_loop: null
      - action: action_submit_trip_plan
      - intent: ask_dining
      - action: action_recommend_dining

  - story: plan trip then request packing tips
    steps:
      - intent: plan_trip
      - action: trip_planning_form
      - active_loop: trip_planning_form
      - active_loop: null
      - action: action_submit_trip_plan
      - intent: ask_packing_tips
      - action: action_recommend_packing

  - story: ask for sustainable transport
    steps:
      - intent: ask_transport
      - action: action_recommend_transport

  - story: ask for eco friendly accommodation
    steps:
      - intent: ask_accommodation
      - action: action_recommend_accommodation

  - story: ask for sustainable activities
    steps:
      - intent: ask_activities
      - action: action_recommend_activities

  - story: ask for flight options
    steps:
      - intent: ask_flights
      - action: action_search_flights

  - story: ask for eco tips directly
    steps:
      - intent: ask_eco_tips
      - action: action_provide_eco_tips

  - story: ask for budget breakdown directly
    steps:
      - intent: ask_budget_breakdown
      - action: action_budget_breakdown

  - story: ask for weather advice directly
    steps:
      - intent: ask_weather
      - action: action_weather_advice

  - story: start carbon calculation
    steps:
      - intent: ask_carbon
      - action: carbon_calculation_form
      - active_loop: carbon_calculation_form

  - story: carbon calculation completed
    steps:
      - action: carbon_calculation_form
      - active_loop: null
      - action: action_calculate_carbon

  - story: request human advisor
    steps:
      - intent: ask_handover
      - action: action_human_handover

  - story: thank the assistant
    steps:
      - intent: thank_you
      - action: utter_thank_you

  - story: ask whether assistant is a bot
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - story: goodbye conversation
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - story: out of scope question
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope
